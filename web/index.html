<body>
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Web Audio API para sonido de alarma -->
  <script>
    function playBeep() {
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        
        oscillator.frequency.value = 1000; // 1000 Hz
        oscillator.type = 'sine';
        
        gain.gain.setValueAtTime(0.3, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.5);
        
        // 3 beeps
        for (let i = 1; i < 3; i++) {
          const osc2 = audioContext.createOscillator();
          const gain2 = audioContext.createGain();
          
          osc2.connect(gain2);
          gain2.connect(audioContext.destination);
          
          osc2.frequency.value = 1000;
          osc2.type = 'sine';
          
          gain2.gain.setValueAtTime(0.3, audioContext.currentTime + i + 0.2);
          gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i + 0.7);
          
          osc2.start(audioContext.currentTime + i + 0.2);
          osc2.stop(audioContext.currentTime + i + 0.7);
        }
      } catch (e) {
        console.log('Error playing beep:', e);
      }
    }
  </script>
</body>
